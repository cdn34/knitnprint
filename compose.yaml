services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: knitnprint
      POSTGRES_USER: knitnprint
      POSTGRES_PASSWORD: knitnprint
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knitnprint -d knitnprint"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -s3.allowedOrigins=http://127.0.0.1:3001,http://localhost:3001
      - -s3.allowDeleteBucketNotEmpty=false
      - -s3.autoCreateBucket=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -admin.user=knitnprint
      - -admin.password=knitnprint-local
    environment:
      AWS_ACCESS_KEY_ID: knitnprint
      AWS_SECRET_ACCESS_KEY: knitnprint-local
      S3_BUCKET: knitnprint-media
    ports:
      - "127.0.0.1:9100:8333"
      - "127.0.0.1:9101:23646"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  postgres_data:
  seaweedfs_data:

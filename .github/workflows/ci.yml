name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: knitnprint
          POSTGRES_USER: knitnprint
          POSTGRES_PASSWORD: knitnprint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knitnprint -d knitnprint"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://knitnprint:knitnprint@localhost:5432/knitnprint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: knitnprint
          POSTGRES_USER: knitnprint
          POSTGRES_PASSWORD: knitnprint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knitnprint -d knitnprint"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://knitnprint:knitnprint@localhost:5432/knitnprint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install shared PostgreSQL test extensions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS citext WITH SCHEMA public'
      - run: cargo test --workspace
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run api:check

  admin-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: knitnprint
          POSTGRES_USER: knitnprint
          POSTGRES_PASSWORD: knitnprint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knitnprint -d knitnprint"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://knitnprint:knitnprint@localhost:5432/knitnprint
      OWNER_EMAIL: owner@knitnprint.test
      OWNER_NAME: CI Owner
      OWNER_PASSWORD: ci-owner-development-passphrase
      E2E_OWNER_EMAIL: owner@knitnprint.test
      E2E_OWNER_PASSWORD: ci-owner-development-passphrase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Start local object storage
        run: |
          docker run --detach \
            --name knitnprint-ci-s3 \
            --publish 9100:5000 \
            motoserver/moto:latest
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --request PUT \
              http://127.0.0.1:9100/knitnprint-media; then
              exit 0
            fi
            sleep 1
          done
          docker logs knitnprint-ci-s3
          exit 1
      - run: npm run db:migrate
      - run: npm run admin:create-owner
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:admin

  hardening:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: knitnprint
          POSTGRES_USER: knitnprint
          POSTGRES_PASSWORD: knitnprint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knitnprint -d knitnprint"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://knitnprint:knitnprint@localhost:5432/knitnprint
      RESTORE_DATABASE_URL: postgres://knitnprint:knitnprint@localhost:5432/knitnprint_restore_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p knitnprint-api --bin migrate
      - run: cargo run -p knitnprint-api --bin seed
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE knitnprint_restore_test'
      - name: Verify backup restore with PostgreSQL 17 client
        run: |
          docker run --rm \
            --network host \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            --env DATABASE_URL \
            --env RESTORE_DATABASE_URL \
            postgres:17-alpine \
            sh scripts/verify-backup-restore.sh
      - run: cargo run -p knitnprint-api --bin check_operations
      - name: Start API for bounded load test
        run: |
          cargo run -p knitnprint-api --bin knitnprint-api >/tmp/knitnprint-api.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/knitnprint-api.log
          exit 1
      - uses: grafana/setup-k6-action@v1
      - run: k6 run tests/load/public-api.js

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # SQLx retains its disabled optional MySQL/RSA dependency in Cargo.lock.
          # KnitNPrint enables PostgreSQL only, so this unpatched RSA path is not built.
          ignore: RUSTSEC-2023-0071
      - name: Scan repository dependencies and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
      # Staging intentionally uses a public ALB/subnets, open task egress,
      # AWS-managed encryption, and no WAF to keep this small environment
      # affordable. Keep these production-hardening findings visible without
      # treating the accepted staging trade-offs as vulnerabilities.
      - name: Report infrastructure hardening recommendations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: misconfig
          severity: CRITICAL,HIGH
          exit-code: 0
      - run: docker build --tag knitnprint-api:ci --file backend/Dockerfile .
      - name: Scan API container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: knitnprint-api:ci
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
